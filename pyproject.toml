[project]
name = "lfx-adspirer"
version = "0.1.0"
description = "Adspirer advertising components for Langflow: campaign performance, wasted spend, keyword research and approved changes on Google, Meta, LinkedIn and TikTok Ads."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Adspirer", email = "support@adspirer.com" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "adspirer", "advertising", "google ads", "meta ads"]

# Runtime deps: lfx (the BUNDLE_API surface) plus httpx, which the components use to call the
# Adspirer REST API directly. There is no Adspirer SDK to install. Fine-grained BUNDLE_API
# compatibility is declared in extension.json's lfx.compat list.
dependencies = [
    "lfx>=1.13.0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.13"]

[project.urls]
Homepage = "https://www.adspirer.com"
Documentation = "https://www.adspirer.com/docs/api-reference/introduction"
Repository = "https://github.com/Adspirer/adspirer-langflow"

# Manifest-shipping distributions are discovered via the ``langflow.extensions`` entry point.
[project.entry-points."langflow.extensions"]
lfx-adspirer = "lfx_adspirer"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_adspirer"]
include = ["src/lfx_adspirer/extension.json", "src/lfx_adspirer/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = ["src/lfx_adspirer", "extension.json", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

# The same rule set as the Langflow repository, so the code lints clean there unchanged.
[tool.ruff.lint]
pydocstyle.convention = "google"
select = ["ALL"]
ignore = [
    "C90", "CPY", "COM812", "ERA", "FIX002", "ISC001", "PERF203", "PLR09", "RUF012",
    "TD002", "TD003", "TRY301", "PLC0415", "D10", "PLW1641", "ANN",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["D1", "INP", "T201"]
"tests/*" = ["D1", "INP001", "PLR2004", "S101", "S105", "S106"]
